name: Release

# Triggered only on version tags — no untrusted input used in run steps
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Least privilege: the job only publishes to npm.
      contents: read
      # Required for npm provenance / OIDC Trusted Publishing.
      id-token: write

    steps:
      # Actions are pinned to a full commit SHA (a moved tag can otherwise
      # inject code into the publish job). Version noted in the trailing comment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      # Publish with provenance so consumers can verify the build's origin.
      #
      # RECOMMENDED (maintainer action, one-time): enable npm Trusted Publishing
      # for this package at https://www.npmjs.com/package/ai-cc-router/access and
      # then DELETE the NPM_TOKEN secret — OIDC (id-token: write) replaces the
      # long-lived, exfiltratable token entirely. Until then the token is used as
      # a fallback.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
