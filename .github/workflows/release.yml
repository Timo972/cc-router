name: Release

# Triggered only on version tags — no untrusted input used in run steps
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Least privilege: the job only publishes to npm.
      contents: read
      # Required for OIDC Trusted Publishing. This is now the ONLY publish
      # credential — there is no NPM_TOKEN fallback (see the Publish step).
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No dependency cache in release builds: a poisoned cache entry would be
      # baked into a published artifact.
      #
      # OIDC needs Node >= 22.14.0, and pnpm >= 11.1.3 — pnpm 11.0.x forwarded
      # setup-node's unresolved ${NODE_AUTH_TOKEN} placeholder as a literal
      # bearer token and got a 404 back (pnpm/pnpm#11513). packageManager pins
      # a compliant pnpm.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # Fail before doing any work if the tag and manifest disagree. An npm
      # version can never be reused, so a mismatched publish is unrecoverable.
      # GITHUB_REF_NAME is read at runtime, not interpolated into the script.
      - name: Resolve version and dist-tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v${TAG} does not match package.json version ${PKG}" >&2
            exit 1
          fi
          # npm applies the "latest" dist-tag unless told otherwise — it does not
          # infer anything from a -rc/-beta suffix. Without this, publishing a
          # prerelease would make it the default `npm install` target. Derive the
          # tag from the prerelease identifier: 0.9.0-rc.1 -> rc, 0.9.0 -> latest.
          case "$TAG" in
            *-*) DIST_TAG="${TAG#*-}"; DIST_TAG="${DIST_TAG%%.*}" ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "DIST_TAG=${DIST_TAG}" >> "$GITHUB_ENV"
          echo "Publishing ${PKG} to dist-tag ${DIST_TAG}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Authenticated purely by OIDC Trusted Publishing — no NODE_AUTH_TOKEN, so
      # a misconfiguration fails loudly instead of silently falling back to a
      # long-lived token.
      #
      # One-time maintainer setup at
      # https://www.npmjs.com/package/@timo972/cc-router/access
      #   repository: Timo972/cc-router
      #   workflow:   release.yml
      #   action:     npm publish
      # npm does not validate that config on save; errors surface only at publish.
      #
      # --provenance is omitted deliberately: attestations are generated
      # automatically for OIDC publishes from a public repo.
      # --no-git-checks is required because a tag push checks out a detached
      # HEAD, which pnpm's default publish-branch check would reject.
      # --tag keeps prereleases off "latest" (see the dist-tag step above).
      - name: Publish
        run: pnpm publish --no-git-checks --access public --tag "$DIST_TAG"
