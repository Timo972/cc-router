name: Release

# Version tags publish automatically. workflow_dispatch is the recovery path
# for an existing tag whose original publish run failed before reaching npm.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.12.0-rc.1
        required: true
        type: string

concurrency:
  # npm dist-tags are mutable shared state. Serialize every publish so rc.0
  # cannot finish after rc.1 and move the `rc` tag backwards.
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Least privilege: the job only publishes to npm.
      contents: read
      # Required for OIDC Trusted Publishing. This is now the ONLY publish
      # credential — there is no NPM_TOKEN fallback (see the Publish step).
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # A manual recovery must build the exact historical tag, not the
          # default branch that contains this workflow definition.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      # No dependency cache in release builds: a poisoned cache entry would be
      # baked into a published artifact.
      #
      # OIDC needs Node >= 22.14.0, and pnpm >= 11.1.3 — pnpm 11.0.x forwarded
      # setup-node's unresolved ${NODE_AUTH_TOKEN} placeholder as a literal
      # bearer token and got a 404 back (pnpm/pnpm#11513). packageManager pins
      # a compliant pnpm.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # The tag is the release authority. Normalize the checked-out manifest at
      # build time so forgetting a package.json bump cannot strand a valid tag.
      # This also lets workflow_dispatch recover an older failed tag while still
      # building that tag's exact source tree. RELEASE_REF is passed through the
      # environment rather than interpolated into the shell script.
      - name: Prepare version and dist-tag
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_REF" in
            v*) TAG="${RELEASE_REF#v}" ;;
            *)
              echo "Release ref must be a v-prefixed version tag, got: $RELEASE_REF" >&2
              exit 1
              ;;
          esac

          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_REF")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ -z "$TAG_COMMIT" ] || [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "Checked-out commit $HEAD_COMMIT does not match tag $RELEASE_REF ($TAG_COMMIT)" >&2
            exit 1
          fi

          # npm validates the semver and rewrites package.json without creating
          # a commit or tag. --ignore-scripts keeps this metadata-only.
          npm version "$TAG" \
            --no-git-tag-version \
            --allow-same-version \
            --ignore-scripts

          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Failed to normalize package.json to tag version ${TAG}; got ${PKG}" >&2
            exit 1
          fi
          # npm applies the "latest" dist-tag unless told otherwise — it does not
          # infer anything from a -rc/-beta suffix. Without this, publishing a
          # prerelease would make it the default `npm install` target. Derive the
          # tag from the prerelease identifier: 0.9.0-rc.1 -> rc, 0.9.0 -> latest.
          case "$TAG" in
            *-*) DIST_TAG="${TAG#*-}"; DIST_TAG="${DIST_TAG%%.*}" ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "RELEASE_VERSION=${PKG}" >> "$GITHUB_ENV"
          echo "DIST_TAG=${DIST_TAG}" >> "$GITHUB_ENV"
          echo "Publishing ${PKG} to dist-tag ${DIST_TAG}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Authenticated purely by OIDC Trusted Publishing — no NODE_AUTH_TOKEN, so
      # a misconfiguration fails loudly instead of silently falling back to a
      # long-lived token.
      #
      # One-time maintainer setup at
      # https://www.npmjs.com/package/@timo972/cc-router/access
      #   repository: Timo972/cc-router
      #   workflow:   release.yml
      #   action:     npm publish
      # npm does not validate that config on save; errors surface only at publish.
      #
      # --provenance is omitted deliberately: attestations are generated
      # automatically for OIDC publishes from a public repo.
      # --no-git-checks is required because a tag push checks out a detached
      # HEAD, which pnpm's default publish-branch check would reject.
      # --tag keeps prereleases off "latest" (see the dist-tag step above).
      - name: Publish
        run: pnpm publish --no-git-checks --access public --tag "$DIST_TAG"
