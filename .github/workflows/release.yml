name: Release

# Triggered only on version tags — no untrusted input used in run steps
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Least privilege: the job only publishes to npm.
      contents: read
      # Required for npm provenance / OIDC Trusted Publishing.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Publish with provenance so consumers can verify the build's origin.
      #
      # RECOMMENDED (maintainer action, one-time): enable npm Trusted Publishing
      # for this package at https://www.npmjs.com/package/@timo972/cc-router/access and
      # then DELETE the NPM_TOKEN secret — OIDC (id-token: write) replaces the
      # long-lived, exfiltratable token entirely. Until then the token is used as
      # a fallback.
      - name: Publish
        run: pnpm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
