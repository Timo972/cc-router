name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No untrusted input used in run steps — safe from injection
jobs:
  build:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24', '26']

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Seed offline production store
        run: pnpm fetch --prod --frozen-lockfile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify CLI starts
        run: >-
          node --input-type=module -e "import { spawnSync } from 'node:child_process'; import { readFileSync } from 'node:fs'; const expected = JSON.parse(readFileSync('package.json', 'utf8')).version; const result = spawnSync(process.execPath, ['dist/cli/bootstrap.js', '--version'], { encoding: 'utf8', env: { ...process.env, NO_UPDATE_NOTIFIER: '1', CI: '1' } }); const actual = result.stdout.trim(); if (result.status !== 0 || actual.length === 0 || actual !== expected) { console.error(result.stderr || ('Expected CLI version ' + expected + ', got ' + JSON.stringify(actual))); process.exit(1); }"
